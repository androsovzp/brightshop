version: '3.8'

services:
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN=${NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN:-szas1b-qj.myshopify.com}
        - NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN=${NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
